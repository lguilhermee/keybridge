<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="auto" role="img" aria-label="Keybridge — Local Model Gateway and Subscription Bridge for Cursor">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e13"/>
      <stop offset="50%" stop-color="#101720"/>
      <stop offset="100%" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00e676" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="78%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e242b"/>
      <stop offset="100%" stop-color="#12161b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f584"/>
      <stop offset="100%" stop-color="#00c864"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect x="4" y="4" width="952" height="372" rx="22" fill="url(#bg)" stroke="url(#cardBorder)" stroke-width="1.5"/>
  <rect x="4" y="4" width="952" height="372" rx="22" fill="url(#grid)"/>
  <rect x="4" y="4" width="952" height="372" rx="22" fill="url(#glowLeft)"/>
  <rect x="4" y="4" width="952" height="372" rx="22" fill="url(#glowRight)"/>

  <!-- Centered App Emblem -->
  <g transform="translate(432, 28)">
    <rect x="0" y="0" width="96" height="96" rx="24" fill="url(#iconBg)" stroke="#3a434e" stroke-width="2"/>
    <!-- Key whose bit is a bridge arch (same mark as the app icon) -->
    <g transform="scale(0.1017) translate(-40 -40)">
      <g transform="translate(512 512) scale(1.15) translate(-513 -491)">
        <path fill="#ffffff" d="M 400 438 H 778 A 22 22 0 0 1 800 460 V 608 A 18 18 0 0 1 782 626 H 758 A 18 18 0 0 1 740 608 V 562 A 60 60 0 0 0 620 562 V 608 A 18 18 0 0 1 602 626 H 578 A 18 18 0 0 1 560 608 V 502 H 400 Z"/>
        <circle cx="340" cy="470" r="84" fill="none" stroke="url(#emeraldGrad)" stroke-width="60"/>
      </g>
    </g>
  </g>

  <!-- Title & Tagline -->
  <text x="480" y="160" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.8">
    Keybridge
  </text>
  <text x="480" y="188" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500">
    Local BYOK Model Gateway &amp; Subscription Bridge for Cursor — Zero Cursor Subscription Required
  </text>

  <!-- Highlight Pills Row -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Pill 1: Bypass $20 Sub Check -->
    <g transform="translate(76, 208)">
      <rect x="0" y="0" width="248" height="30" rx="15" fill="#00e676" fill-opacity="0.12" stroke="#00e676" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#00e676"/>
      <text x="28" y="19" fill="#d1fae5">Bypasses $20 Cursor Pro Check</text>
    </g>

    <!-- Pill 2: Use Any Model -->
    <g transform="translate(336, 208)">
      <rect x="0" y="0" width="256" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="19" fill="#e0f2fe">Use Any Model &amp; Custom API</text>
    </g>

    <!-- Pill 3: Computer Use + Full Agent -->
    <g transform="translate(604, 208)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.45" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#c084fc"/>
      <text x="28" y="19" fill="#f3e8ff">Full Agent · Computer Use · MCP</text>
    </g>
  </g>

  <!-- Architecture Flow Strip -->
  <g transform="translate(48, 258)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace">
    <!-- Node 1: Cursor IDE -->
    <rect x="0" y="0" width="220" height="86" rx="12" fill="#131c27" stroke="#263344" stroke-width="1.2"/>
    <text x="110" y="27" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="700">Cursor IDE / Agent</text>
    <text x="110" y="47" text-anchor="middle" fill="#64748b" font-size="11">Agent · Plan · Debug · Ask</text>
    <text x="110" y="65" text-anchor="middle" fill="#00e676" font-size="11">Computer Use · Subagents · MCP</text>

    <!-- Arrow 1 -->
    <path d="M 228 43 L 308 43" stroke="#00e676" stroke-width="1.8" stroke-dasharray="4 3"/>
    <polygon points="308,38 318,43 308,48" fill="#00e676"/>
    <text x="273" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">Connect-RPC</text>
    <text x="273" y="59" text-anchor="middle" fill="#64748b" font-size="9.5">Ultra Mock</text>

    <!-- Node 2: Keybridge Gateway -->
    <rect x="322" y="0" width="220" height="86" rx="12" fill="#112224" stroke="#00e676" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="432" y="27" text-anchor="middle" fill="#00f584" font-size="13.5" font-weight="700">Keybridge Local Service</text>
    <text x="432" y="47" text-anchor="middle" fill="#cbd5e1" font-size="11">Protocol &amp; Tool Dispatch</text>
    <text x="432" y="65" text-anchor="middle" fill="#94a3b8" font-size="11">Prefix Cache · Semble · SQLite</text>

    <!-- Arrow 2 -->
    <path d="M 550 43 L 630 43" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 3"/>
    <polygon points="630,38 640,43 630,48" fill="#38bdf8"/>
    <text x="595" y="34" text-anchor="middle" fill="#94a3b8" font-size="10">OpenAI / Anthropic</text>
    <text x="595" y="59" text-anchor="middle" fill="#64748b" font-size="9.5">OAuth Providers</text>

    <!-- Node 3: Any Model & Subscriptions -->
    <rect x="644" y="0" width="220" height="86" rx="12" fill="#131c27" stroke="#263344" stroke-width="1.2"/>
    <text x="754" y="27" text-anchor="middle" fill="#f1f5f9" font-size="13.5" font-weight="700">Any Model or Subscription</text>
    <text x="754" y="47" text-anchor="middle" fill="#38bdf8" font-size="11">Claude · Codex · Devin · Grok</text>
    <text x="754" y="65" text-anchor="middle" fill="#94a3b8" font-size="11">Gemini/Antigravity · OpenCode · API</text>
  </g>
</svg>
